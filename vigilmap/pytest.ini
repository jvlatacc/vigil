[pytest]
# Scoped config for vigilmap's python tests (exporter transform, drift guard,
# CLI). Running `pytest vigilmap/` from the repo root uses THIS file, not the
# root tests/pytest.ini — so the root suite's coverage and asyncio addopts
# stay out of the exporter's CI job. No database is required anywhere here.

testpaths = export/tests
python_files = test_*.py
addopts = -v -ra --strict-markers --disable-warnings
