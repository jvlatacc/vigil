# Credential access: an EDR credential-dumping or secret-store signal on a
# user/host pair, corroborated within the window by SIEM evidence of brute
# force or valid-account abuse.
#
# Keys on (user, host): the pair is the correlation identity — the same
# user on two hosts and two users on one host are different sequences.
#
# Confidence arithmetic: 0.78 base; two distinct sources -> 0.88, inside
# the review band (>= 0.85) but below auto (0.90): a disable_user row waits
# for an analyst regardless — appropriate for an action with no executor
# wired and high false-positive cost (locking out a service account).
id: credential-access-2src
entity_key_fields: [user, host]
window_seconds: 900
steps:
  - sources: [crowdstrike, sentinelone, microsoft_defender]
    techniques: [T1003, T1555]
    min_severity: high
    max_gap_seconds: 300
  - sources: [splunk, elastic, opensearch]
    techniques: [T1110, T1078]
    max_gap_seconds: 600
action_type: disable_user
target_field: user
base_confidence: 0.78
