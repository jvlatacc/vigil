# Edge (Local Autonomy Mesh) has its own lock and its own venv: it imports
# nothing from core, tools or any other service (the `edge` contract in
# .importlinter enforces the first), so a control-plane dependency bump can't
# reach the node that defends the segment. Not installed as a package: it runs
# as `python -m services.edge` from the repo root (or /app in the image), the
# same way the other services do.
[project]
name = "vigil-edge"
version = "0.0.0"
description = "Vigil edge daemon: signed-policy autonomy for partitioned segments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pytest>=8",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `services.edge` imports the way it does at runtime.
pythonpath = ["../.."]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint.isort]
# Matches the repo's isort (setup.cfg), so both agree on Edge's own imports.
known-first-party = ["services"]
