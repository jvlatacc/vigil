{{- if and .Values.edgeDaemon.enabled .Values.edgeDaemon.externalSecret.enabled }}
{{- /*
ExternalSecret — materializes the edge enrollment Secret from an external
store (AWS Secrets Manager, Vault, GCP Secret Manager, etc.) via the
ExternalSecrets Operator: the same pattern as externalsecret.yaml, scoped to
the edge node's one-time enrollment token. The target Secret carries the
single key VIGIL_EDGE_ENROLLMENT_TOKEN, which the DaemonSet's secretKeyRef
reads (edge-daemonset.yaml). Takes precedence over the plain
edge-enrollment-secret.yaml template, which is skipped when this is enabled.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vigil.edgeDaemon.fullname" . }}-enrollment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "edge") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.edgeDaemon.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "edgeDaemon.externalSecret.secretStoreRef.name is required" .Values.edgeDaemon.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.edgeDaemon.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "vigil.edgeDaemon.fullname" . }}-enrollment
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIGIL_EDGE_ENROLLMENT_TOKEN
      remoteRef:
        {{- toYaml (required "edgeDaemon.externalSecret.remoteRef is required" .Values.edgeDaemon.externalSecret.remoteRef) | nindent 8 }}
{{- end }}
