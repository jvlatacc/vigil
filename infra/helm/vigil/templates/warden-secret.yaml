{{- if and .Values.warden.enabled (not .Values.warden.tokens.existingSecret) (not .Values.warden.externalSecret.enabled) (or .Values.warden.tokens.enrollmentToken .Values.warden.tokens.sentinelToken) }}
{{- /*
Warden's node tokens, separate from the shared app Secret: a node's bearer
token enrolls and revokes independently of the control plane's secrets.

Keys render only when set; the DaemonSet's secretKeyRefs are optional, so a
tokenless Secret (and even a missing one) leaves Warden fail-closed rather
than broken — it simply cannot enroll until a token is provided.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigil.warden.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.warden.tokens.enrollmentToken }}
  WARDEN_ENROLLMENT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.warden.tokens.sentinelToken }}
  WARDEN_SENTINEL_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
