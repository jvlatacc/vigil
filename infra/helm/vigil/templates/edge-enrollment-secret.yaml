{{- if and .Values.edgeDaemon.enabled
            .Values.edgeDaemon.enrollmentToken
            (not .Values.edgeDaemon.enrollmentExistingSecret)
            (not .Values.edgeDaemon.externalSecret.enabled) }}
{{- /*
Chart-templated enrollment Secret — the dev/first-rollout path. The
production paths are edgeDaemon.enrollmentExistingSecret (your own Secret)
or edgeDaemon.externalSecret (the ESO pattern); prefer either over putting
a real token in a values file. Skipped entirely when another enrollment
source is configured — exactly one source may win, and this one loses.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigil.edgeDaemon.fullname" . }}-enrollment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "edge") | nindent 4 }}
type: Opaque
stringData:
  VIGIL_EDGE_ENROLLMENT_TOKEN: {{ required "edgeDaemon.enrollmentToken is empty" .Values.edgeDaemon.enrollmentToken | quote }}
{{- end }}
