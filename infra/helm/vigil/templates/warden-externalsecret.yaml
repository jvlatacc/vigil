{{- if and .Values.warden.enabled .Values.warden.externalSecret.enabled }}
{{- /*
ExternalSecret for Warden's node tokens — the same ExternalSecrets Operator
contract as the shared app ExternalSecret (externalsecret.yaml), but
targeting the warden-only Secret the DaemonSet reads. When this is enabled
warden-secret.yaml is skipped, mirroring the app-level guard.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vigil.warden.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.warden.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "warden.externalSecret.secretStoreRef.name is required" .Values.warden.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.warden.externalSecret.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "vigil.warden.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- if .Values.warden.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml .Values.warden.externalSecret.dataFrom | nindent 4 }}
  {{- end }}
  {{- if .Values.warden.externalSecret.data }}
  data:
    {{- range $key, $ref := .Values.warden.externalSecret.data }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        {{- toYaml $ref.remoteRef | nindent 8 }}
    {{- end }}
  {{- end }}
{{- end }}
