# Decoy file share (feature 5 decoy farm). Samba serves a fake share whose
# full_audit stream, via rsyslog, is the feed OpenCanary watches. Everything
# maps to guest — there is no real account behind it.
[global]
workgroup = WORKGROUP
server string = fileserver-01
netbios name = FILESERVER-01
security = user
map to guest = Bad User
log file = /var/log/samba/log.all
log level = 1
max log size = 0
logging = syslog
# The audit feed: prefix user|ip|share, then the action — the exact shape
# OpenCanary's smb watcher parses (its regex keys on smbd_audit:).
full_audit:priority = notice
full_audit:facility = local7
full_audit:prefix = %u|%I|%S
full_audit:success = connect,opendir,write_data,sendfile,unlink,rename,mkdir,rmdir,chmod,connectpath
full_audit:failure = connect,write_data,sendfile,rename,mkdir,rmdir,chmod

[public]
path = /srv/decoy-share
browseable = yes
read only = no
guest ok = yes
vfs objects = full_audit
