        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # --- SBOM: inventory the signed image, attest it keylessly. -------
      # Release-blocking (no continue-on-error): a release ships with its
      # SBOM or does not ship.
      #
      # anchore/sbom-action pinned by commit SHA; syft pinned to the version
      # the release SBOMs were validated against.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      # Scan the same immutable index digest cosign just signed — never a tag,
      # never the config digest docker manifest inspect reports. syft resolves
      # a multi-arch index to ONE platform image: the host platform by default
      # (linux/amd64 on ubuntu runners; verified with syft 1.54.1 against a
      # known index — --platform linux/arm64 selects the arm64 child instead).
      # The arm64 image shares the package inventory for the compiled layers it
      # differs in; the source-side SBOMs in update-release cover the tree for
      # both platforms.
      - name: Generate image SBOM (CycloneDX)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/vigil-soc/vigil-agent
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          syft scan "${IMAGE}@${DIGEST}" \
            -o "cyclonedx-json@1.6=vigil-sbom-agent-${VERSION}.cdx.json"

      # Keyless, mirroring the sign step above: same subject, no --key — the
      # job's id-token: write supplies GitHub OIDC. Consumers verify with the
      # same certificate identity as the signature (see SECURITY.md).
      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/vigil-soc/vigil-agent
          VERSION: ${{ needs.version.outputs.version }}
        run: >
          cosign attest --yes --type cyclonedx
          --predicate "vigil-sbom-agent-${VERSION}.cdx.json"
          "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # Smoke-test: pull the images and verify they start
  # ---------------------------------------------------------------------------
  # Backend and daemon run their default command and must answer the image
  # HEALTHCHECK URL. An import of the package __init__ never loaded the
  # entry point, which is why v0.5.0's smoke was green while the published
  # images crash-looped. Agent has no HEALTHCHECK (the port depends on the
  # command), so it still loads worker.js / serve.js via node --eval.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test images
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    needs: [version, build-backend, build-daemon, build-agent]
    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Default CMD: uvicorn services.api.main:app on 6987. Fail if the
      # process exits or GET /api/health never answers — the same URL as
      # Dockerfile.backend's HEALTHCHECK. HTTP 200 means the server accepted
      # a connection, not that storage is up; DEV_MODE=true is enough.
      - name: Backend — starts and answers /api/health
        run: |
          set -eu
          IMAGE=ghcr.io/vigil-soc/vigil-backend:${{ needs.version.outputs.version }}
          cid=$(docker run -d \
            -e DEV_MODE=true \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e REDIS_URL=redis://localhost:6379 \
            "$IMAGE")
          ok=0
          cleanup() {
            if [ "$ok" != 1 ]; then
              echo "::error::backend exited or did not answer GET /api/health on 6987"
              docker logs "$cid" || true
            fi
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          i=0
          while [ "$i" -lt 90 ]; do
            i=$((i + 1))
            if [ -z "$(docker ps -q --filter "id=$cid")" ]; then
              exit 1
            fi
            if docker exec "$cid" curl -fsS --max-time 2 http://localhost:6987/api/health >/dev/null 2>&1; then
              ok=1
              echo "backend ok"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "waiting for GET /api/health (${i}s)"
            fi
            sleep 1
          done
          exit 1

      - name: Backend — SPA present
        run: |
          docker run --rm \
            ghcr.io/vigil-soc/vigil-backend:${{ needs.version.outputs.version }} \
            test -f /app/clients/web/build/index.html \
            || { echo "::error::SPA missing from image — web client not copied to /app/clients/web/build"; exit 1; }

      # Default CMD: python services/daemon/main.py. MCP client construction
      # happens in SOCDaemon._init_components() at runtime, so only a live
      # process reaches the failure v0.5.0 hid. Probe GET /health on 9091 —
      # the same URL as Dockerfile.daemon's HEALTHCHECK.
      - name: Daemon — starts and answers /health
        run: |
          set -eu
          IMAGE=ghcr.io/vigil-soc/vigil-daemon:${{ needs.version.outputs.version }}
          cid=$(docker run -d \
            -e DEV_MODE=true \
            "$IMAGE")
          ok=0
          cleanup() {
            if [ "$ok" != 1 ]; then
              echo "::error::daemon exited or did not answer GET /health on 9091"
              docker logs "$cid" || true
            fi
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          i=0
          while [ "$i" -lt 90 ]; do
            i=$((i + 1))
            if [ -z "$(docker ps -q --filter "id=$cid")" ]; then
              exit 1
            fi
            if docker exec "$cid" curl -fsS --max-time 2 http://localhost:9091/health >/dev/null 2>&1; then
              ok=1
              echo "daemon ok"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "waiting for GET /health (${i}s)"
            fi
            sleep 1
          done
          exit 1

      # Both commands the chart runs, loaded but not started: the main blocks
      # guard on process.argv[1], which --eval leaves undefined. Proves the
      # emitted JavaScript resolves its imports inside the image — the one thing
      # typecheck cannot tell us, since tsc reads .ts and node runs .js.
      - name: Agent — entry points load
        run: |
          docker run --rm \
            ghcr.io/vigil-soc/vigil-agent:${{ needs.version.outputs.version }} \
            node --input-type=module -e "
              await import('/app/dist/worker.js');
              await import('/app/dist/serve.js');
              console.log('agent ok');
            "

  # ---------------------------------------------------------------------------
  # Attach image digests to the GitHub Release
  # ---------------------------------------------------------------------------
  update-release:
    name: Annotate GitHub Release
    if: github.repository == 'Vigil-SOC/vigil'
    runs-on: ubuntu-latest
    # Direct needs on the build jobs for their plumbed push digests — the
    # multi-arch index digests cosign signed and SBOM-attested. smoke-test
    # already gated on them transitively, so ordering is unchanged: SBOMs
    # attach only to a verified release.
    needs: [version, smoke-test, build-backend, build-daemon, build-agent]
    permissions:
      contents: write    # edit release body
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build support tarball
        run: scripts/build-support-tarball.sh "${{ needs.version.outputs.version }}" support-dist

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- SBOMs: nine CycloneDX documents per release, all release-blocking
      # (no continue-on-error): a release ships with its SBOMs or does not
      # ship. Source-side: the Python lock, the four npm lockfiles, and the
      # whole source tree — the only artifact that covers the medic uv.lock,
      # since the medic image is never pushed. Image-side: regenerated here
      # from the plumbed index digests, so the files on the release page and
      # the registry attestations describe the same signed digests.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install cyclonedx-py
        run: pipx install cyclonedx-bom==7.5.0

      - name: Generate SBOMs (CycloneDX)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          mkdir -p sbom-dist

          # Python lock — the full exact-pin resolution of requirements.lock.
          cyclonedx-py requirements requirements.lock \
            --of JSON \
            -o "sbom-dist/vigil-sbom-python-${VERSION}.cdx.json"

          # npm lockfiles — lockfile-only, so no node_modules install is
          # needed; each surface runs from its own directory.
          for proj in clients/web clients/desktop services/agent infra/docker/mcp-packages; do
            name=$(basename "$proj")
            ( cd "$proj" && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 \
                --package-lock-only --ignore-npm-errors \
                --of JSON \
                -o "$OLDPWD/sbom-dist/vigil-sbom-npm-${name}-${VERSION}.cdx.json" )
          done

          # Whole source tree — a directory scan, so it also catches the
          # medic uv.lock and the Dockerfiles.
          syft scan . \
            -o "cyclonedx-json@1.6=sbom-dist/vigil-sbom-source-${VERSION}.cdx.json"

          # Per-image SBOMs, regenerated from the plumbed index digests — the
          # exact digests signed and attested in the build jobs.
          syft scan "ghcr.io/vigil-soc/vigil-backend@${{ needs.build-backend.outputs.digest }}" \
            -o "cyclonedx-json@1.6=sbom-dist/vigil-sbom-backend-${VERSION}.cdx.json"
          syft scan "ghcr.io/vigil-soc/vigil-daemon@${{ needs.build-daemon.outputs.digest }}" \
            -o "cyclonedx-json@1.6=sbom-dist/vigil-sbom-daemon-${VERSION}.cdx.json"
          syft scan "ghcr.io/vigil-soc/vigil-agent@${{ needs.build-agent.outputs.digest }}" \
            -o "cyclonedx-json@1.6=sbom-dist/vigil-sbom-agent-${VERSION}.cdx.json"

      # Support-tarball convention: a .sha256 sibling per file holding the
      # bare file name, so `sha256sum -c <file>.sha256` works as pasted.
      - name: SBOM checksums
        run: |
          cd sbom-dist
          for f in ./*.cdx.json; do
            sha256sum "$(basename "$f")" > "${f}.sha256"
          done

      - name: Append image refs and SBOMs to release notes
        uses: softprops/action-gh-release@v3
        with:
          append_body: true
          files: |
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz
            support-dist/vigil-support-${{ needs.version.outputs.version }}.tar.gz.sha256
            sbom-dist/vigil-sbom-backend-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-backend-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-daemon-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-daemon-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-agent-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-agent-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-python-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-python-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-npm-web-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-npm-web-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-npm-desktop-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-npm-desktop-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-npm-agent-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-npm-agent-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-npm-mcp-packages-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-npm-mcp-packages-${{ needs.version.outputs.version }}.cdx.json.sha256
            sbom-dist/vigil-sbom-source-${{ needs.version.outputs.version }}.cdx.json
            sbom-dist/vigil-sbom-source-${{ needs.version.outputs.version }}.cdx.json.sha256
          body: |

            ---
            ### Container Images

            | Image | Tag | Digest |
            |-------|-----|--------|
            | `ghcr.io/vigil-soc/vigil-backend` | `${{ needs.version.outputs.version }}` | `${{ needs.build-backend.outputs.digest }}` |
            | `ghcr.io/vigil-soc/vigil-daemon`  | `${{ needs.version.outputs.version }}` | `${{ needs.build-daemon.outputs.digest }}` |
            | `ghcr.io/vigil-soc/vigil-agent`   | `${{ needs.version.outputs.version }}` | `${{ needs.build-agent.outputs.digest }}` |

            ```bash
            # Pull by tag
            docker pull ghcr.io/vigil-soc/vigil-backend:${{ needs.version.outputs.version }}
            docker pull ghcr.io/vigil-soc/vigil-daemon:${{ needs.version.outputs.version }}
            docker pull ghcr.io/vigil-soc/vigil-agent:${{ needs.version.outputs.version }}
            ```

            ---
            ### SBOMs (CycloneDX 1.6)

            Every image above carries a keyless CycloneDX attestation bound to
            its signed digest; the same inventories plus source-side SBOMs are
            attached below. Verify an attestation (see SECURITY.md for details):

            ```bash
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity https://github.com/Vigil-SOC/vigil/.github/workflows/release.yml@refs/tags/v${{ needs.version.outputs.version }} \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghcr.io/vigil-soc/vigil-backend:${{ needs.version.outputs.version }}
            ```

            Attached files (each with a `.sha256` sibling — `sha256sum -c <file>.sha256`):

            - `vigil-sbom-backend-${{ needs.version.outputs.version }}.cdx.json` — released backend image
            - `vigil-sbom-daemon-${{ needs.version.outputs.version }}.cdx.json` — released daemon image
            - `vigil-sbom-agent-${{ needs.version.outputs.version }}.cdx.json` — released agent image
            - `vigil-sbom-python-${{ needs.version.outputs.version }}.cdx.json` — Python lock (`requirements.lock`)
            - `vigil-sbom-npm-web-${{ needs.version.outputs.version }}.cdx.json` — web client lockfile
            - `vigil-sbom-npm-desktop-${{ needs.version.outputs.version }}.cdx.json` — desktop client lockfile
            - `vigil-sbom-npm-agent-${{ needs.version.outputs.version }}.cdx.json` — agent lockfile
            - `vigil-sbom-npm-mcp-packages-${{ needs.version.outputs.version }}.cdx.json` — MCP connector lockfile
            - `vigil-sbom-source-${{ needs.version.outputs.version }}.cdx.json` — whole source tree (incl. `services/medic/uv.lock`)

            Image SBOMs describe the `linux/amd64` platform (syft resolves the
            multi-arch index to the scanner's platform); the source-side SBOMs
            cover the tree for all platforms.
