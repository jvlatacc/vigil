# Scoped to vigilmap/** per the repo's per-area workflow pattern: a PR that
# only touches vigilmap runs exactly this workflow.
name: VigilMap

on:
  push:
    branches: [main, develop]
    paths:
      - "vigilmap/**"
      - ".github/workflows/vigilmap.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "vigilmap/**"
      - ".github/workflows/vigilmap.yml"
  workflow_dispatch:

jobs:
  node:
    name: Build & test (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vigilmap
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vigilmap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # TODO(exporter): pytest job for vigilmap/export/ — the transform unit tests
  # and the drift guard asserting vigilmap/export/key_rule.py agrees with
  # core.memory.entity_keys. That job needs the repo's Python CI context (core
  # is importable there), not the Node one. Lands with the exporter PR.

  # TODO(determinism): regenerate vigilmap/public/data/sample-memory.json with
  # vigilmap/scripts/generate_sample.py into a temp dir and diff against the
  # checked-in file, so the bundled demo cannot rot. Lands with the
  # sample-generator PR.
