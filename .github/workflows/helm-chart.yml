name: Helm Chart

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/helm/**'
      - 'infra/database/init/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    paths:
      - 'infra/helm/**'
      - 'infra/database/init/**'
      - '.github/workflows/helm-chart.yml'

jobs:
  lint:
    name: Lint and Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.2

      - name: Verify db-init SQL copies are in sync
        run: |
          # The chart bundles a copy of infra/database/init/*.sql under
          # infra/helm/vigil/files/database-init/ because Helm can only read files
          # inside the chart directory. Drift here means the chart would
          # ship a different schema than the docker-compose stack.
          diff -r infra/database/init infra/helm/vigil/files/database-init \
            --exclude=README.md

      - name: Verify vendored chart dependencies
        # Subcharts are vendored in charts/ and checksummed in SHA256SUMS, so
        # this job fetches nothing: Docker Hub rate-limits anonymous pulls from
        # Actions runner IPs (HTTP 429), which took the old
        # `helm dependency update` step down repo-wide on 2026-10-09 — the
        # 30/60/120/240/300s backoff it used can't outlast a sustained limit.
        # Verify the pinned artifacts, then extract them for lint/template
        # (Helm 4 wants directories, not just tgz). The checksum file lives at
        # the chart root — helm rejects non-chart files inside charts/.
        run: |
          cd infra/helm/vigil
          sha256sum -c SHA256SUMS
          for tgz in charts/*.tgz; do
            tar -xzf "$tgz" -C charts/
          done

      - name: helm lint (discovered values profiles)
        # Every values*.yaml in the chart directory is linted automatically:
        # values.yaml is the default variant (no -f), any other file is
        # layered with -f. Adding a cloud profile is a file addition — this
        # workflow needs no edit to cover it.
        run: |
          for values_file in infra/helm/vigil/values*.yaml; do
            name="$(basename "${values_file%.yaml}")"
            echo "== helm lint (${name}) =="
            if [ "$name" = "values" ]; then
              helm lint infra/helm/vigil
            else
              helm lint infra/helm/vigil -f "$values_file"
            fi
          done

      - name: helm lint (Bitnami subcharts enabled)
        run: |
          helm lint infra/helm/vigil \
            --set postgresql.enabled=false --set postgresql.bitnami.enabled=true \
            --set redis.enabled=false --set redis.bitnami.enabled=true

      - name: helm template (discovered values profiles)
        # Mirror of the lint loop: every values*.yaml renders to its own
        # manifest for the kubeconform step. The default variant keeps the
        # explicit postgresPassword; profile files layer on top of the base
        # defaults and only need the required Anthropic key.
        run: |
          for values_file in infra/helm/vigil/values*.yaml; do
            name="$(basename "${values_file%.yaml}")"
            manifest="/tmp/manifest-${name}.yaml"
            echo "== helm template (${name}) =="
            if [ "$name" = "values" ]; then
              helm template release-check infra/helm/vigil \
                --set secrets.anthropicApiKey=test-key \
                --set secrets.postgresPassword=test-password \
                > "$manifest"
            else
              helm template release-check infra/helm/vigil \
                -f "$values_file" \
                --set secrets.anthropicApiKey=test-key \
                > "$manifest"
            fi
            echo "Rendered $(grep -c '^kind:' "$manifest") resources."
          done

      - name: helm template (Bitnami subcharts)
        run: |
          helm template release-check infra/helm/vigil \
            --set secrets.anthropicApiKey=test-key \
            --set postgresql.enabled=false --set postgresql.bitnami.enabled=true \
            --set redis.enabled=false --set redis.bitnami.enabled=true \
            > /tmp/manifest-bitnami.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/manifest-bitnami.yaml) resources."

      - name: Validate manifests with kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz
          for manifest in /tmp/manifest-*.yaml; do
            echo "== kubeconform ($(basename "$manifest")) =="
            ./kubeconform -strict -ignore-missing-schemas -summary "$manifest"
          done

  chart-testing:
    name: chart-testing
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        # Subcharts are vendored, so skip the dependency build ct would run
        # here — re-resolving them pulls postgresql from Docker Hub, which
        # rate-limits anonymous pulls from runner IPs (HTTP 429). Vendored
        # charts also make the upstream repo registrations unnecessary.
        run: ct lint --check-version-increment=false --skip-helm-dependencies --target-branch ${{ github.event.repository.default_branch }} --chart-dirs infra/helm
