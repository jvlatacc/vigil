name: vigil_flutter
description: "Vigil first-party client — iOS, Android, macOS, Windows, Linux."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  # Tokens at rest — iOS Keychain / Android Keystore / desktop keyrings.
  flutter_secure_storage: ^9.2.2
  # Streaming markdown rendering for "Ask Vigil" answers: the `markdown`
  # package (pure Dart, from the Dart team) parses chat markdown to an AST;
  # lib/chat/markdown_text.dart renders it with the Vigil theme.
  markdown: ^7.3.0
  # SVG path-data parser for the VigilIcons stroke set (pure Dart, the same
  # parser flutter_svg uses).
  path_parsing: ^1.1.0
  # Generated dart-dio client for the frozen /api/v1 contract
  # (tool/generate_api_client.py). Pure Dart; shares the app's Dio instance.
  vigil_api_v1:
    path: api/v1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true

  # The console self-hosts these two families as woff2 (which Flutter cannot
  # use); the same families ship here as static latin-subset TTFs. The token
  # ramp's 650 weight resolves to w700 per CSS static-font matching.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus-jakarta-sans-400.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-sans-500.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta-sans-600.ttf
          weight: 600
        - asset: assets/fonts/plus-jakarta-sans-700.ttf
          weight: 700
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/roboto-mono-400.ttf
          weight: 400
        - asset: assets/fonts/roboto-mono-500.ttf
          weight: 500
